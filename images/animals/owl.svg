<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cute owl mascot">
  <defs>
    <linearGradient id="owl-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="55" ry="55" fill="url(#owl-fur)"/>
  <ellipse cx="100" cy="130" rx="34" ry="40" fill="#E9D5FF"/>
  <!-- Wings -->
  <path d="M48 110 Q30 130 50 160" fill="url(#owl-fur)"/>
  <path d="M152 110 Q170 130 150 160" fill="url(#owl-fur)"/>
  <!-- Head (merged) -->
  <g transform="translate(100 80)">
    <!-- Ear tufts -->
    <path d="M-30 -20 L-22 -36 L-12 -22 Z" fill="url(#owl-fur)"/>
    <path d="M30 -20 L22 -36 L12 -22 Z" fill="url(#owl-fur)"/>
    <!-- Eye discs -->
    <circle cx="-14" cy="0" r="14" fill="#F8FAFC"/>
    <circle cx="14" cy="0" r="14" fill="#F8FAFC"/>
    <circle cx="-14" cy="0" r="9" fill="#1f0b2b"/>
    <circle cx="14" cy="0" r="9" fill="#1f0b2b"/>
    <circle cx="-14" cy="0" r="5" fill="#FBBF24"/>
    <circle cx="14" cy="0" r="5" fill="#FBBF24"/>
    <circle cx="-14" cy="0" r="2" fill="#1f0b2b"/>
    <circle cx="14" cy="0" r="2" fill="#1f0b2b"/>
    <circle cx="-12" cy="-2" r="0.8" fill="#fff"/>
    <circle cx="16" cy="-2" r="0.8" fill="#fff"/>
    <!-- Beak -->
    <path d="M-4 14 L4 14 L0 22 Z" fill="#FB923C"/>
  </g>
  <!-- Feet -->
  <g transform="translate(80 170)">
    <path d="M0 0 L-4 8 M0 0 L0 8 M0 0 L4 8" stroke="#FB923C" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(120 170)">
    <path d="M0 0 L-4 8 M0 0 L0 8 M0 0 L4 8" stroke="#FB923C" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Belly spots -->
  <circle cx="92" cy="130" r="2" fill="#A78BFA"/>
  <circle cx="108" cy="138" r="2" fill="#A78BFA"/>
  <circle cx="100" cy="148" r="2" fill="#A78BFA"/>
</svg>
