<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cute deer mascot">
  <defs>
    <linearGradient id="deer-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="52" ry="38" fill="url(#deer-fur)"/>
  <ellipse cx="100" cy="148" rx="30" ry="22" fill="#FEF3C7"/>
  <!-- Tail -->
  <circle cx="148" cy="120" r="8" fill="#FEF3C7"/>
  <!-- Head -->
  <g transform="translate(100 90)">
    <!-- Antlers -->
    <path d="M-22 -28 L-26 -50 M-26 -50 L-32 -54 M-26 -50 L-22 -56 M-26 -50 L-20 -54" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 -28 L26 -50 M26 -50 L32 -54 M26 -50 L22 -56 M26 -50 L20 -54" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <!-- Ears -->
    <ellipse cx="-26" cy="-18" rx="6" ry="12" fill="url(#deer-fur)" transform="rotate(-30 -26 -18)"/>
    <ellipse cx="26" cy="-18" rx="6" ry="12" fill="url(#deer-fur)" transform="rotate(30 26 -18)"/>
    <ellipse cx="-26" cy="-16" rx="3" ry="8" fill="#FF8FA3" transform="rotate(-30 -26 -16)"/>
    <ellipse cx="26" cy="-16" rx="3" ry="8" fill="#FF8FA3" transform="rotate(30 26 -16)"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="30" ry="28" fill="url(#deer-fur)"/>
    <ellipse cx="0" cy="10" rx="14" ry="12" fill="#FEF3C7"/>
    <!-- Eyes -->
    <ellipse cx="-10" cy="-2" rx="4" ry="5" fill="#1f0b2b"/>
    <ellipse cx="10" cy="-2" rx="4" ry="5" fill="#1f0b2b"/>
    <circle cx="-8" cy="-4" r="1.4" fill="#fff"/>
    <circle cx="12" cy="-4" r="1.4" fill="#fff"/>
    <!-- Cheeks -->
    <circle cx="-18" cy="6" r="3.6" fill="#FF8FA3" opacity="0.6"/>
    <circle cx="18" cy="6" r="3.6" fill="#FF8FA3" opacity="0.6"/>
    <!-- Nose -->
    <ellipse cx="0" cy="8" rx="3" ry="2.2" fill="#1f0b2b"/>
    <!-- Mouth -->
    <path d="M-4 14 Q0 18 4 14" stroke="#1f0b2b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Spots -->
    <circle cx="-12" cy="20" r="1.6" fill="#FEF3C7" opacity="0.7"/>
    <circle cx="14" cy="22" r="1.6" fill="#FEF3C7" opacity="0.7"/>
  </g>
  <!-- Paws -->
  <ellipse cx="80" cy="174" rx="10" ry="6" fill="#D97706"/>
  <ellipse cx="120" cy="174" rx="10" ry="6" fill="#D97706"/>
</svg>
