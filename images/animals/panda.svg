<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cute panda mascot">
  <defs>
    <linearGradient id="panda-bw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="145" rx="52" ry="38" fill="#1f2937"/>
  <ellipse cx="100" cy="150" rx="34" ry="24" fill="url(#panda-bw)"/>
  <!-- Head -->
  <g transform="translate(100 90)">
    <!-- Ears -->
    <circle cx="-30" cy="-30" r="12" fill="#1f2937"/>
    <circle cx="30" cy="-30" r="12" fill="#1f2937"/>
    <circle cx="-30" cy="-30" r="6" fill="#FF8FA3"/>
    <circle cx="30" cy="-30" r="6" fill="#FF8FA3"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="36" ry="32" fill="url(#panda-bw)"/>
    <!-- Eye patches -->
    <ellipse cx="-14" cy="-4" rx="9" ry="11" fill="#1f2937" transform="rotate(-15 -14 -4)"/>
    <ellipse cx="14" cy="-4" rx="9" ry="11" fill="#1f2937" transform="rotate(15 14 -4)"/>
    <!-- Eyes -->
    <circle cx="-14" cy="-2" r="3.6" fill="#fff"/>
    <circle cx="14" cy="-2" r="3.6" fill="#fff"/>
    <circle cx="-13" cy="-2" r="2" fill="#1f0b2b"/>
    <circle cx="15" cy="-2" r="2" fill="#1f0b2b"/>
    <!-- Cheeks -->
    <circle cx="-24" cy="10" r="4" fill="#FF8FA3" opacity="0.6"/>
    <circle cx="24" cy="10" r="4" fill="#FF8FA3" opacity="0.6"/>
    <!-- Nose -->
    <ellipse cx="0" cy="8" rx="3" ry="2.2" fill="#1f0b2b"/>
    <!-- Mouth -->
    <path d="M-5 14 Q0 18 5 14" stroke="#1f0b2b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Arms holding a bamboo -->
  <ellipse cx="64" cy="140" rx="10" ry="14" fill="#1f2937" transform="rotate(-20 64 140)"/>
  <ellipse cx="136" cy="140" rx="10" ry="14" fill="#1f2937" transform="rotate(20 136 140)"/>
  <rect x="86" y="130" width="28" height="6" rx="3" fill="#84cc16"/>
  <rect x="90" y="124" width="6" height="18" rx="2" fill="#65a30d"/>
  <!-- Paws -->
  <ellipse cx="80" cy="174" rx="10" ry="6" fill="#1f2937"/>
  <ellipse cx="120" cy="174" rx="10" ry="6" fill="#1f2937"/>
</svg>
